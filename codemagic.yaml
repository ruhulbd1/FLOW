workflows:
  android-native-workflow:
    name: Native Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Setup Gradle 9.3.1 and Build APK
        script: |
          # গ্রেডল ৯.৩.১ র‍্যাপর নিশ্চিত করা
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          # জেনারেট হওয়া gradlew দিয়ে ডিবাগ এপিকে বিল্ড করা
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
