workflows:
  android-native-workflow:
    name: Native Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Build APK Cleanly
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
