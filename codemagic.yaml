workflows:
  android-native-workflow:
    name: Native Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Build APK without Signing Check
        script: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          else
            ./gradlew wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew
          # সাইনিং কনফিগারেশন এবং ভ্যালিডেশন বাইপাস করে সরাসরি এপিকে বিল্ড করা
          ./gradlew assembleDebug -x validateSigningDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
