workflows:
  android-native-workflow:
    name: Native Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Build APK Successfully
        script: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          else
            ./gradlew wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew
          # কি-স্টোর বা সাইনিং চেকিং বাইপাস করে সরাসরি এপিকে বিল্ড করা
          ./gradlew assembleDebug -Pandroid.injected.signing.store.file=
    artifacts:
      - app/build/outputs/apk/**/*.apk
