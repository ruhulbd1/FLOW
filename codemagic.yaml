workflows:
  android-native-workflow:
    name: Native Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Build Unsigned Release APK
        script: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          else
            ./gradlew wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew
          # কি-স্টোর এরর এড়ানোর জন্য রিলিজ সাইনিং বাদ দিয়ে সরাসরি এপিকে বিল্ড করা
          ./gradlew assembleRelease -x signReleaseBundle -x signReleaseApk || ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/apk/**/*.apk
