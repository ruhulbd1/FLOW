workflows:
  android-native-workflow:
    name: Native Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Build Debug APK
        script: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          else
            ./gradlew wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew
          # কোনো সাইনিং বা কি-স্টোর ঝামেলা ছাড়াই সরাসরি ডিবাগ এপিকে বিল্ড করা
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
