workflows:
  android-native-workflow:
    name: Native Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Fix Gradle Version and Build APK
        script: |
          # প্রজেক্টের রিকোয়ারমেন্ট অনুযায়ী গ্রেডল ভার্সন 9.3.1 সেট করা হলো
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          else
            ./gradlew wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/apk/**/*.apk
